name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and public-boundary checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public compliance
        run: pnpm check:public-compliance

      - name: Verify release trust chain
        run: pnpm check:release-trust

      - name: Verify provider artwork provenance
        run: pnpm icons:check

      - name: Verify npm production licenses
        run: pnpm licenses:check:npm

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build renderer
        run: pnpm build:renderer

  backend:
    name: Rust checks
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-C linker-features=-lld"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Create frontend placeholder
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --jobs 1

  supply-chain:
    name: Dependency licenses and sources
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Install audit tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-about --locked --version 0.9.1 --features cli

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm production licenses
        run: node scripts/check-npm-licenses.mjs --output THIRD_PARTY_NPM_LICENSES.json

      - name: Audit Rust licenses and sources
        working-directory: src-tauri
        run: cargo deny --config ../deny.toml check advisories licenses sources

      - name: Generate Rust dependency notices
        run: |
          cargo about generate --manifest-path src-tauri/Cargo.toml -o THIRD_PARTY_RUST_LICENSES.html about.hbs
          node scripts/normalize-rust-notices.mjs

      - name: Upload dependency reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-license-reports-${{ github.sha }}
          path: |
            THIRD_PARTY_NPM_LICENSES.json
            THIRD_PARTY_RUST_LICENSES.html
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Private development history is intentionally excluded from the
          # public source export. Public repositories always scan full history.
          fetch-depth: ${{ github.event.repository.private && 1 || 0 }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
