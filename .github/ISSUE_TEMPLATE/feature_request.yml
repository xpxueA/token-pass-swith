name: "Feature Request"
description: "Propose a Token Pass Swith improvement."
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: "I have searched existing issues in this public repository."
          required: true
  - type: dropdown
    attributes:
      label: Related App
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - OpenClaw
        - General
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem or Motivation
      placeholder: "I was trying to ... and found that ..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
    validations:
      required: false
