name: "Documentation Issue"
description: "Report documentation errors, outdated content, or missing information."
labels:
  - documentation
body:
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: "I have searched existing issues in this public repository."
          required: true
  - type: input
    attributes:
      label: Document Location
      placeholder: "e.g. README.md#section-name or docs/..."
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Issue Type
      options:
        - "Typo or grammar"
        - "Outdated content"
        - "Missing information"
        - "Translation issue"
        - "Other"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
    validations:
      required: true
